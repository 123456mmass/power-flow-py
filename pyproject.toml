[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "power-flow-py"
version = "0.1.0"
description = "Project-owned power-flow and stability algorithms, reimplemented from audited contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
]
web = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
power-flow = "power_flow.cli:main"
power-flow-api = "power_flow.service.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
power_flow = ["cases/data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "matlab: live differential checks that require MATLAB and the source repository",
]
